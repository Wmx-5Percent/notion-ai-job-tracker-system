# Company Registry — one row per company board.
# `ats` selects the Collector (see jobtracker/collectors/registry.py); `id` is how
# that ATS identifies the board:
#   greenhouse / ashby / lever : a single slug (string)
#   workday / official         : a small mapping (added when those collectors land)
#
# POLICY: keep a company even if a pull returns nothing or errors — it may be a
# transient timeout or a slug that differs from the name (e.g. DoorDash =
# "doordashusa"). The run skips a dead/empty board and moves on; never auto-prune.

